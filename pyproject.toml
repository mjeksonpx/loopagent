[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name had to change twice: `loopgate` belongs to an unrelated project on PyPI, and
# `loopagent` is rejected as "too similar" because `loop-agent` already exists (PyPI normalises dashes).
# The import package stays `loopgate` and so does the command; only the name you pip-install differs.
name = "loopagent-gate"
version = "0.4.2"
description = "Accept agent work by proof, not by confidence: gates that print a marker and refuse to take the agent's word."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "loopagent contributors" }]
keywords = ["ai-agents", "code-review", "evidence", "gates", "ci", "verification"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Environment :: Console",
]
dependencies = []

[project.urls]
Repository = "https://github.com/mjeksonpx/loopagent"
Issues = "https://github.com/mjeksonpx/loopagent/issues"

[project.optional-dependencies]
# Optional: one product-acceptance scenario validates published JSON contracts. Everything else is stdlib.
contracts = ["jsonschema>=4.18"]

[project.scripts]
loopgate = "loopgate.cli:main"

[tool.setuptools]
packages = ["loopgate", "loopgate.gates", "loopgate.templates"]

[tool.setuptools.package-data]
loopgate = ["py.typed"]
# Templates ship with the package: example profiles, the tree-parity policy, the review fixtures and the
# loop contract skill that `loopgate init` copies into a project.
"loopgate.templates" = ["configs/*.json", "configs/fixtures/*.json", "skills/loop-engineering/*.md"]
"loopgate.gates" = ["*.py"]
